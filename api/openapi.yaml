            RateLimit-Remaining: { $ref: '#/components/headers/RateLimit-Remaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimit-Reset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/DefaultError' }

  /api/v1/devices/{deviceId}/console/{kind}/ticket:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/ConsoleKind'
    post:
      tags: [console]
      operationId: createConsoleTicket
      summary: Get a single-use ticket for a console WebSocket
      description: |
        Checks visibility, scope `console`, the rights for `kind` (denials
        are audited) and reachability. Then it returns a random 256-bit
        ticket, bound to this user, device, kind and credential. The ticket
        is valid for 60 seconds and works once. Logout or revocation cancels
        unused tickets. The response body is never logged.

        **WebSocket.** Open `url` (which does not contain the ticket) and
        pass the values in `protocols` as WebSocket subprotocols:
        `new WebSocket(url, ticket.protocols)`, which sends
        `Sec-WebSocket-Protocol: outband.console.v1, outband.ticket.<ticket>`.
        The server answers with `outband.console.v1` only. Tickets are not
        accepted in the URL. At the upgrade the server marks the ticket used
        and checks again: the credential is still valid, the rights for
        `kind` still hold, and, for a ticket issued to a cookie session, a
        matching `Origin` is present.

        **Frames.** Binary frames carry raw terminal bytes in both
        directions. Text frames carry JSON control messages:
        `{"type":"state","state":"connecting|open|closed","reason":"..."}` from
        the server, and `{"type":"resize","cols":80,"rows":24}` from the
        client (ignored for SOL).

        **Close codes.** `4401`: bad, used or expired ticket, or Origin
        refused. `4403`: credential ended, user locked, or rights lost.
        `4409`: device not reachable, or busy. `1011`: server error.

        The server opens the stream through MeshCentral's own relay (AMT
        redirection for SOL), so AMT credentials never leave the server. A
        device has at most one SOL session at a time.
      parameters:
        - $ref: '#/components/parameters/XOutband'
      responses:
        '201':
          description: Ticket created.
          headers:
            RateLimit-Limit: { $ref: '#/components/headers/RateLimit-Limit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimit-Remaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimit-Reset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleTicket' }
              example:
                url: /api/v1/devices/EXAMPLEnodeId00000000000000000000000000000000000000000000000000/console/sol
                protocols: [outband.console.v1, outband.ticket.EXAMPLEticket]
                expires_at: '2026-01-01T12:01:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Console kind not available now (`not_reachable`), not supported on this device (`not_supported`), or already in use (`busy`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/DefaultError' }

  /api/v1/events:
    get:
      tags: [events]
      operationId: listEvents
      summary: Event and audit log (newest first)
      description: |
        The events the caller may see: events about groups and devices the
        caller has rights on, plus the caller's own user events.
        `LIMITEVENTS` narrows a group to the caller's own events. With
        `ALLEVENTS` or full site rights the caller sees the whole domain,
        except through a group-restricted token (see Authorization). The
        Privacy rules decide `message`, `user`, `token_name` and `source_ip`.
      parameters:
        - name: device
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: group
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: type
          in: query
          description: Event type, such as `node`, `mesh` or `user`.
          schema: { type: string, maxLength: 32 }
        - name: audit
          in: query
          description: Only Outband audit events.
          schema: { type: boolean }
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          headers:
            RateLimit-Limit: { $ref: '#/components/headers/RateLimit-Limit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimit-Remaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimit-Reset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
              example:
                items:
                  - id: evt_EXAMPLE01
                    time: '2026-01-01T12:00:01Z'
                    type: node
                    action: outband.power
                    message: Power action "off" dispatched through the agent
                    user: { id: u_3f9a1c2b, name: null, redacted: true }
                    token_id: t_77d0e4aa
                    token_name: null
                    device_id: EXAMPLEnodeId00000000000000000000000000000000000000000000000000
                    group_id: EXAMPLEgroupId0000000000000000000000000000000000000000000000000
                    action_id: act_EXAMPLE01
                    outcome: success
                next_cursor: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/DefaultError' }

  /api/v1/stream:
    get:
      tags: [stream]
      operationId: streamEvents
      summary: Live updates (Server-Sent Events)
      description: |
        A `text/event-stream` response. Browsers use `EventSource` with the
        session cookie. Machine clients send `Authorization: Bearer`. A
        credential in the URL (`token`, `access_token` or similar) is
        rejected with `400 invalid_request`, and redacted from logs.

        **Wire format.** The server first sends `retry: 5000`. Each message
        then has:
        * `event:` the type;
        * `id:` a sequence number;
        * `data:` one line of JSON, which is the **envelope**
          `{"type": ..., "data": ...}` (schema `StreamMessage`). Its `type`
          equals the `event:` field.
        A `: ping` comment arrives every 25 seconds.

        **Types:** `ready`, `device.updated`, `device.power`,
        `device.removed`, `event.created`, `resync` and `closed`. Each has its
        own schema; see `StreamMessage`. Clients MUST ignore stream messages
        whose `type` they don't recognise. New types may be added within v1.
        The set of types is open (`StreamMessageType` is an
        `x-extensible-enum`), and `StreamOther` stands for any type that is
        not listed. Generated clients must not treat the listed types as
        exhaustive.

        **Recommended subscription.** Integrations that track device state
        should subscribe with
        `types=device.power,device.updated,device.removed,resync,closed`.
        `ready` is always sent; `types` filters only the other messages.

        **Visibility.** Every message passes the same rules as the REST
        endpoints, using the caller's rights at the moment it is sent. That
        includes the group restriction and the Privacy rules. Messages
        delivered again after a reconnect are checked the same way.

        **Resume.** Works for the last 5 minutes, using the `Last-Event-ID`
        header or the `last_event_id` query parameter (for clients that
        reconnect by hand). The header wins when both are sent. If the gap
        cannot be filled, the server sends `resync`.

        **End.** The stream ends with `closed` (see Live updates). A
        credential may hold 5 concurrent streams at most.
      parameters:
        - name: types
          in: query
          description: Comma-separated types to receive (default all). Unknown type names are ignored, not rejected.
          schema: { type: string, maxLength: 256, examples: ['device.power,device.updated,device.removed,resync,closed'] }
        - name: Last-Event-ID
          in: header
          schema: { type: string, maxLength: 64 }
        - name: last_event_id
          in: query
          description: Same as the `Last-Event-ID` header. It is not a credential.
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Event stream.
          headers:
            RateLimit-Limit: { $ref: '#/components/headers/RateLimit-Limit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimit-Remaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimit-Reset' }
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/StreamMessage' }
              example: "retry: 5000\n\nevent: device.power\nid: 42\ndata: {\"type\":\"device.power\",\"data\":{\"id\":\"EXAMPLEnodeId00000000000000000000000000000000000000000000000000\",\"power\":{\"state\":\"off\",\"since\":\"2026-01-01T12:00:05Z\"}}}\n\n"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/DefaultError' }

components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: xid
      description: MeshCentral session cookie. Non-GET requests need `X-Outband` and a matching `Origin`.
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: obt_<43 base64url characters>
      description: API token from `createToken`. TLS only.

  headers:
    RateLimit-Limit:
      description: Requests allowed in the current window.
      schema: { type: integer }
    RateLimit-Remaining:
      description: Requests left in the current window.
      schema: { type: integer }
    RateLimit-Reset:
      description: Seconds until the window resets.
      schema: { type: integer }
    Retry-After:
      description: Seconds to wait before retrying.
      schema: { type: integer }

  parameters:
    XOutband:
      name: X-Outband
      in: header
      description: CSRF guard. Required for cookie-authenticated requests that are not GET or HEAD.
      required: false
      schema: { type: string, enum: ['1'] }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: string, pattern: '^tok_[A-Za-z0-9_-]{6,60}$' }
    ConsoleKind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [sol, terminal] }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 512 }
    Since:
      name: since
      in: query
      description: Only events at or after this time.
      schema: { type: string, format: date-time }
    Until:
      name: until
      in: query
      description: Only events before this time.
      schema: { type: string, format: date-time }

  responses:
    BadRequest:
      description: Malformed request (`invalid_request`). `details.field` names the bad field.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: No valid credential (`unauthenticated`), an expired or revoked token (`token_expired`, `token_revoked`), or step-up needed (`reauth_required`).
      headers:
        WWW-Authenticate:
          schema: { type: string, examples: ['Bearer realm="outband"'] }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Failed CSRF or Origin check, or an `OPTIONS` request (`csrf_failed`); missing scope (`insufficient_scope`); missing right, wrong credential type, or not an administrator (`forbidden`); address not allowed for the token (`ip_not_allowed`); bearer without TLS (`https_required`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such resource, or not visible to the caller (`not_found`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidHost:
      description: The `Host` header is not a configured name (`invalid_host`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: The body is not `application/json` (`unsupported_media_type`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Over a rate limit, or an IP ban (`rate_limited`).
      headers:
        Retry-After: { $ref: '#/components/headers/Retry-After' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: The API is not available in the current server configuration (`unavailable`). See Availability.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DefaultError:
      description: Any other error, such as `500 internal`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Id:
      type: string
      description: Last segment of a MeshCentral device or group id.
      pattern: '^[A-Za-z0-9@$_-]{8,128}$'
      examples: [EXAMPLEnodeId00000000000000000000000000000000000000000000000000]

    UserId:
      type: string
      description: Last segment of a MeshCentral user id, or, where the Privacy rules apply, an opaque pseudonym starting with `u_`.
      pattern: '^[^/\s]{1,256}$'
      examples: [alice]

    NextCursor:
      type: [string, 'null']
      description: Pass as `cursor` for the next page. `null` on the last page.

    ErrorCode:
      type: string
      x-extensible-enum:
        - invalid_request
        - unauthenticated
        - invalid_credentials
        - invalid_code
        - no_pending_login
        - reauth_required
        - token_expired
        - token_revoked
        - token_limit
        - csrf_failed
        - invalid_host
        - https_required
        - ip_not_allowed
        - insufficient_scope
        - forbidden
        - not_found
        - not_reachable
        - not_supported
        - busy
        - idempotency_conflict
        - unsupported_media_type
        - rate_limited
        - unavailable
        - internal

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
          description: Extra context, such as `field`, `required_scope`, `path` or `reason`. Never the value of a `writeOnly` field.
        request_id: { type: string, description: Same as the `Outband-Request-Id` header. }

    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
      examples:
        - error: { code: not_found, message: Device not found, request_id: req_EXAMPLE01 }

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          x-extensible-enum: [ok, degraded, starting]

    TwoFactorMethod:
      type: string
      description: '`otp` is an authenticator app (TOTP).'
      x-extensible-enum: [otp, backup, email, sms, messaging, yubikey]

    TwoFactorFeatures:
      type: object
      required: [available, ip_exemptions, methods]
      properties:
        available: { type: boolean, description: Two-factor login is offered by this server's configuration. }
        ip_exemptions: { type: boolean, description: The domain exempts some client addresses from the second factor. }
        methods:
          type: array
          items: { $ref: '#/components/schemas/TwoFactorMethod' }

    ServerFeatures:
      type: object
      required: [amt, twofa, api_tokens, console_kinds, legacy_ui]
      properties:
        amt: { type: boolean }
        twofa: { $ref: '#/components/schemas/TwoFactorFeatures' }
        api_tokens: { type: boolean, description: Bearer authentication is on (false while the kill switch is set). }
        console_kinds:
          type: array
          items: { $ref: '#/components/schemas/ConsoleKind' }
        legacy_ui: { type: boolean }

    ServerInfo:
      type: object
      required: [name, version, outband_version, api_version, features]
      properties:
        name: { type: string }
        version: { type: string, description: MeshCentral core version. }
        outband_version: { type: string }
        api_version: { type: string }
        features: { $ref: '#/components/schemas/ServerFeatures' }

    User:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/UserId' }
        name: { type: string }
        email: { type: [string, 'null'], description: Left out for tokens without `identity`. }
        siteadmin: { type: integer, description: 'MeshCentral site-rights bitmask (4294967295 = full). Left out for tokens without `identity`.' }

    Scope:
      type: string
      x-extensible-enum: [read, power_on, power_off, console, identity, audit]

    SessionServer:
      type: object
      required: [name]
      properties:
        name: { type: string }
        version: { type: string, description: Only when authenticated. }

    SessionTwoFactor:
      type: object
      required: [required]
      properties:
        required: { type: boolean, description: A pending login is waiting for a second factor. It authenticates nothing. }
        methods:
          type: array
          items: { $ref: '#/components/schemas/TwoFactorMethod' }
        expires_at: { type: [string, 'null'], format: date-time }

    Session:
      type: object
      required: [authenticated, user, auth_method, scopes, server, twofa]
      properties:
        authenticated: { type: boolean }
        user:
          anyOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
        auth_method:
          type: [string, 'null']
          x-extensible-enum: [cookie, token]
        scopes:
          type: array
          items: { $ref: '#/components/schemas/Scope' }
        server: { $ref: '#/components/schemas/SessionServer' }
        twofa: { $ref: '#/components/schemas/SessionTwoFactor' }

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 256 }
        password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }

    LoginSuccess:
      type: object
      required: [authenticated, user]
      properties:
        authenticated: { type: boolean, const: true }
        user: { $ref: '#/components/schemas/User' }

    LoginPending:
      type: object
      required: [authenticated, twofa]
      properties:
        authenticated: { type: boolean, const: false }
        twofa: { $ref: '#/components/schemas/SessionTwoFactor' }

    LoginResult:
      oneOf:
        - $ref: '#/components/schemas/LoginSuccess'
        - $ref: '#/components/schemas/LoginPending'

    SecondFactorRequest:
      type: object
      additionalProperties: false
      properties:
        code: { type: string, minLength: 4, maxLength: 64, writeOnly: true }
        method: { type: string, enum: [otp, backup, email, sms, messaging, yubikey] }
        send: { type: boolean, description: 'Ask the server to send a code (`email`, `sms`, `messaging`).' }

    TokenOwner:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/UserId' }
        name: { type: string }

    ApiToken:
      type: object
      required: [id, name, owner, prefix, scopes, groups, allowed_ips, created_at, expires_at, last_used_at, revoked_at]
      properties:
        id: { type: string, pattern: '^tok_[A-Za-z0-9_-]{6,60}$' }
        name: { type: string }
        owner: { $ref: '#/components/schemas/TokenOwner' }
        prefix: { type: string, description: First 8 characters of the secret. }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/Scope' }
        groups:
          type: [array, 'null']
          description: The group restriction. `null` means every group the owner can see.
          items: { $ref: '#/components/schemas/Id' }
        allowed_ips:
          type: [array, 'null']
          description: Allowed client addresses (CIDR). `null` means any.
          items: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }

    TokenPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiToken' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    CreateTokenRequest:
      type: object
      required: [name]
      additionalProperties: false
      description: Give exactly one of `scopes` or `profile`.
      properties:
        name: { type: string, minLength: 1, maxLength: 64, pattern: '^[\x20-\x7E]+$' }
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [read, power_on, power_off, console, identity, audit] }
        profile:
          type: string
          enum: [device_power]
          description: '`device_power` = `read` + `power_on` + `power_off`.'
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
          description: 'Limits: 365 days (read and identity only), 90 (audit or power), 30 (console).'
        groups:
          type: array
          description: Limit the token to these groups. Required with `console`.
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/Id' }
        allowed_ips:
          type: array
          description: Limit the token to these client addresses (IPv4 or IPv6 CIDR).
          minItems: 1
          maxItems: 20
          items: { type: string, maxLength: 64 }

    CreatedToken:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: '#/components/schemas/ApiToken' }
        secret:
          type: string
          description: Shown once. Send as the bearer credential.
          pattern: '^obt_[A-Za-z0-9_-]{43}$'

    AdminSettings:
      type: object
      required: [bearer, bearer_source, updated_at, updated_by]
      properties:
        bearer: { type: boolean }
        bearer_source:
          type: string
          description: '`runtime`: stored through this API. `config`: the startup default.'
          x-extensible-enum: [runtime, config]
        updated_at: { type: [string, 'null'], format: date-time }
        updated_by: { type: [string, 'null'], description: The user id of the administrator who last changed it. }

    AdminSettingsUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        bearer: { type: boolean }

    Rights:
      type: object
      required: [mask, names]
      description: The caller's effective MeshCentral rights.
      properties:
        mask: { type: integer, description: 'MESHRIGHT bitmask (4294967295 = full).' }
        names:
          type: array
          description: Lower-case names of the bits that are set, or `[admin]` for full rights.
          items: { type: string }

    GroupKind:
      type: string
      description: 'MeshCentral group type: amt (AMT only), agent, local (no agent), ipkvm.'
      x-extensible-enum: [amt, agent, local, ipkvm]

    Group:
      type: object
      required: [id, name, description, kind, rights, device_count]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        description: { type: string }
        kind: { $ref: '#/components/schemas/GroupKind' }
        rights: { $ref: '#/components/schemas/Rights' }
        device_count: { type: integer, minimum: 0 }

    GroupPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Group' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    GroupRef:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }

    ConsoleKind:
      type: string
      description: '`sol`: Intel AMT Serial-over-LAN. `terminal`: agent shell (not yet available). Text consoles only.'
      x-extensible-enum: [sol, terminal]

    PowerAction:
      type: string
      x-extensible-enum: ['on', 'off', reset, cycle, sleep, wake]

    PowerPath:
      type: string
      x-extensible-enum: [agent, amt, wol, mqtt, ipkvm]

    PowerState:
      type: string
      description: 'From MeshCentral power state: 1 on, 2-4 sleep, 5 hibernate, 6 soft_off, 7 present (seen, state unknown), 8 off, 0 unknown.'
      x-extensible-enum: ['on', sleep, hibernate, soft_off, 'off', present, unknown]

    DeviceConnectivity:
      type: object
      required: [agent, amt_cira, amt_local, relay, mqtt]
      properties:
        agent: { type: boolean }
        amt_cira: { type: boolean }
        amt_local: { type: boolean }
        relay: { type: boolean }
        mqtt: { type: boolean }

    DeviceAmt:
      type: object
      required: [state, version, reachable]
      properties:
        state:
          type: string
          description: '`none`: no Intel AMT detected.'
          x-extensible-enum: [none, unprovisioned, provisioning, provisioned, unknown]
        version: { type: [string, 'null'] }
        reachable: { type: boolean, description: The server can reach AMT now. }

    DevicePower:
      type: object
      required: [state, since]
      properties:
        state: { $ref: '#/components/schemas/PowerState' }
        since: { type: [string, 'null'], format: date-time }

    DeviceCapabilities:
      type: object
      description: What the caller can do now, given scope, rights and reachability.
      required: [power, console]
      properties:
        power:
          type: array
          description: Actions available with their default path.
          items: { $ref: '#/components/schemas/PowerAction' }
        power_via:
          type: object
          description: Each available action's default path, for example `agent` (graceful) or `amt` (hard).
          additionalProperties: { $ref: '#/components/schemas/PowerPath' }
        power_paths:
          type: object
          description: Every path each action can take now, for use with `via`. The first entry is the default.
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/PowerPath' }
        console:
          type: array
          items: { $ref: '#/components/schemas/ConsoleKind' }

    Device:
      type: object
      required: [id, name, host, group, os, online, connectivity, amt, power, last_seen, capabilities]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        host: { type: [string, 'null'] }
        group: { $ref: '#/components/schemas/GroupRef' }
        os: { type: [string, 'null'] }
        ips:
          type: array
          description: Left out for tokens without `console` (see Privacy).
          items: { type: string }
        online: { type: boolean, description: The agent is connected. }
        connectivity: { $ref: '#/components/schemas/DeviceConnectivity' }
        amt: { $ref: '#/components/schemas/DeviceAmt' }
        power: { $ref: '#/components/schemas/DevicePower' }
        last_seen: { type: [string, 'null'], format: date-time }
        capabilities: { $ref: '#/components/schemas/DeviceCapabilities' }

    DevicePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Device' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    AgentInfo:
      type: object
      required: [version, type, connected_at]
      properties:
        version: { type: [string, 'null'] }
        type: { type: [integer, 'null'] }
        connected_at: { type: [string, 'null'], format: date-time }

    HardwareSummary:
      type: object
      required: [manufacturer, model, cpu, memory_mb]
      properties:
        manufacturer: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        serial: { type: [string, 'null'], description: Left out for tokens without `console` (see Privacy). }
        cpu: { type: [string, 'null'] }
        memory_mb: { type: [integer, 'null'] }

    DeviceDetail:
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          required: [rights, description, tags, agent, hardware]
          properties:
            rights: { $ref: '#/components/schemas/Rights' }
            description: { type: [string, 'null'] }
            tags:
              type: array
              items: { type: string }
            agent:
              anyOf:
                - $ref: '#/components/schemas/AgentInfo'
                - type: 'null'
            hardware:
              anyOf:
                - $ref: '#/components/schemas/HardwareSummary'
                - type: 'null'

    PowerRequest:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action: { type: string, enum: ['on', 'off', reset, cycle, sleep, wake] }
        via:
          type: string
          enum: [agent, amt, wol, mqtt, ipkvm]
          description: Use only this path, with no fallback. `403` with `details.path` if the right for it is missing; `409` if it cannot carry the action now.

    PowerResult:
      type: object
      required: [action_id, device_id, action, paths, status]
      properties:
        action_id: { type: string, description: Also recorded in the audit event. }
        device_id: { $ref: '#/components/schemas/Id' }
        action: { $ref: '#/components/schemas/PowerAction' }
        paths:
          type: array
          description: The paths the command went out on.
          items: { $ref: '#/components/schemas/PowerPath' }
        status:
          type: string
          x-extensible-enum: [dispatched]

    ConsoleTicket:
      type: object
      required: [url, protocols, expires_at]
      properties:
        url: { type: string, description: The relative WebSocket path. It does not contain the ticket. }
        protocols:
          type: array
          description: 'The WebSocket subprotocols to request, in order: `outband.console.v1` and `outband.ticket.<ticket>`. A secret; do not log it.'
          items: { type: string }
        expires_at: { type: string, format: date-time }

    EventActor:
      type: object
      required: [id, name, redacted]
      properties:
        id: { $ref: '#/components/schemas/UserId' }
        name: { type: [string, 'null'] }
        redacted: { type: boolean, description: True when `id` is a pseudonym (see Privacy). }

    Event:
      type: object
      required: [id, time, type, action, message, user, token_id, token_name, device_id, group_id]
      properties:
        id: { type: string }
        time: { type: string, format: date-time }
        type: { type: string, description: 'Event type, such as `node`, `mesh`, `user` or `server`.' }
        action: { type: string, description: 'Event kind, such as `login`, `outband.power` or `outband.token.create`.' }
        message: { type: string, description: Built from an allowlisted template (see Privacy). }
        user:
          anyOf:
            - $ref: '#/components/schemas/EventActor'
            - type: 'null'
        token_id: { type: [string, 'null'], description: 'A token id, or a `t_` pseudonym.' }
        token_name: { type: [string, 'null'] }
        device_id:
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        group_id:
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        action_id: { type: [string, 'null'] }
        outcome:
          type: string
          x-extensible-enum: [success, denied, failed]
        source_ip: { type: [string, 'null'], description: Only for callers allowed to see it (see Privacy). }

    EventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        next_cursor: { $ref: '#/components/schemas/NextCursor' }

    StreamReady:
      type: object
      required: [type, data]
      properties:
        type: { type: string, const: ready }
        data:
          type: object
          required: [server_time]
          properties:
            server_time: { type: string, format: date-time }

    DeviceUpdated:
      type: object
      required: [type, data]
      properties:
        type: { type: string, const: device.updated }
        data: { $ref: '#/components/schemas/Device' }

    DevicePowerChanged:
      type: object
      required: [type, data]
      properties:
        type: { type: string, const: device.power }
        data:
          type: object
          required: [id, power]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            power: { $ref: '#/components/schemas/DevicePower' }

    DeviceRemoved:
      type: object
      required: [type, data]
      properties:
        type: { type: string, const: device.removed }
        data:
          type: object
          description: The device was deleted or is no longer visible.
          required: [id]
          properties:
            id: { $ref: '#/components/schemas/Id' }

    EventCreated:
      type: object
      required: [type, data]
      properties:
        type: { type: string, const: event.created }
        data: { $ref: '#/components/schemas/Event' }

    StreamResync:
      type: object
      required: [type, data]
      properties:
        type: { type: string, const: resync }
        data:
          type: object
          description: Empty. Refetch `/api/v1/devices`.

    StreamClosed:
      type: object
      required: [type, data]
      properties:
        type: { type: string, const: closed }
        data:
          type: object
          required: [reason]
          properties:
            reason:
              type: string
              description: '`disabled`: bearer authentication was turned off.'
              x-extensible-enum: [revoked, expired, logout, locked, rights, disabled, shutdown]

    StreamMessageType:
      type: string
      description: Stream message type. Open set; new types may be added within v1, and clients MUST ignore types they don't recognise.
      x-extensible-enum: [ready, device.updated, device.power, device.removed, event.created, resync, closed]

    StreamOther:
      type: object
      description: A message of a type not listed in this version. Clients MUST ignore it.
      required: [type, data]
      properties:
        type:
          $ref: '#/components/schemas/StreamMessageType'
          not:
            enum: [ready, device.updated, device.power, device.removed, event.created, resync, closed]
        data: {}

    StreamMessage:
      description: |
        The JSON on each `data:` line. `type` equals the SSE `event:` field.
        The set of types is open (see `StreamMessageType`). A message is
        either one of the types defined in this version
        (`StreamKnownMessage`), or a `StreamOther`, which clients MUST
        ignore. Generated clients must not be exhaustive over the types.
      anyOf:
        - $ref: '#/components/schemas/StreamKnownMessage'
        - $ref: '#/components/schemas/StreamOther'

    StreamKnownMessage:
      description: The message types defined in this version, by `type`. Not exhaustive within v1.
      oneOf:
        - $ref: '#/components/schemas/StreamReady'
        - $ref: '#/components/schemas/DeviceUpdated'
        - $ref: '#/components/schemas/DevicePowerChanged'
        - $ref: '#/components/schemas/DeviceRemoved'
        - $ref: '#/components/schemas/EventCreated'
        - $ref: '#/components/schemas/StreamResync'
        - $ref: '#/components/schemas/StreamClosed'
      discriminator:
        propertyName: type
        x-extensible-enum: [ready, device.updated, device.power, device.removed, event.created, resync, closed]
        mapping:
          ready: '#/components/schemas/StreamReady'
          device.updated: '#/components/schemas/DeviceUpdated'
          device.power: '#/components/schemas/DevicePowerChanged'
          device.removed: '#/components/schemas/DeviceRemoved'
          event.created: '#/components/schemas/EventCreated'
          resync: '#/components/schemas/StreamResync'
          closed: '#/components/schemas/StreamClosed'
