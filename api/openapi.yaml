openapi: 3.1.0
info:
  title: Outband API
  version: 1.0.0-draft.5
  summary: Public, versioned HTTP API for Outband (a MeshCentral fork).
  description: |
    The Outband API is the only interface the Outband web UI uses. Third-party
    clients, such as automation tools, use the same API. It is a facade over
    MeshCentral's own internals: the same database, the same permission model
    and the same power and event functions that MeshCentral's own UI uses.
    Clients never need MeshCentral's internal websocket protocol.

    ## Conventions
    * **Versioning.** Every endpoint lives under `/api/v1`. Within v1, changes
      are additive only: new endpoints, new optional fields, new enum values.
      Breaking changes ship as `/api/v2`. When an endpoint or field is
      deprecated, the server sends `Deprecation` and `Sunset` headers, and the
      deprecated item keeps working for at least 6 months after the first
      release that deprecates it. Every response carries
      `Outband-API-Version` (this document's `info.version`) and
      `Outband-Request-Id`.
    * **Open enums.** Enums in responses are open: they are written as
      `x-extensible-enum`, and new values may appear within v1. Clients must
      accept unknown values and map them to an "unknown" variant. Generated
      clients should be configured to emit one. Enums in requests are closed
      (`enum`); the server rejects other values with `400`.
    * **Unknown fields.** Clients must ignore unknown response fields. The
      server rejects unknown request-body fields with `400`.
    * **Nullability.** A nullable primitive is written `type: [<type>, 'null']`.
      A nullable reference is written `anyOf: [{$ref}, {type: 'null'}]`.
      Optional fields that are absent are simply left out, never sent as
      `null`, unless the schema says the field is nullable.
    * **Identifiers.** MeshCentral ids have the form `<kind>/<domain>/<value>`.
      The API exposes only `<value>` (schemas `Id` and `UserId`). The domain
      comes from the request's Host.
    * **Errors.** Every non-2xx response has the body `{"error": {...}}`
      (schema `Error`). `code` is stable; `message` is for humans.
      `details` never echoes the value of a `writeOnly` field (password,
      2FA code).
    * **Pagination.** List endpoints take `limit` (default 50, max 200) and
      `cursor`, and return `{"items": [...], "next_cursor": ...}`. The last
      page has `next_cursor: null`. Cursors are opaque.
    * **Times** are RFC 3339 in UTC.

    ## Availability
    `/api/v1` needs real user authentication and a configured server name.
    Every endpoint except `/api/v1/health` answers `503 unavailable` when
    either condition is false:
    * the server runs in a mode without user authentication (`nousers`, or a
      fixed `user` set on the command line);
    * the server has no configured DNS name, meaning no `dns` setting on the
      domain and no server certificate name. MeshCentral's placeholder
      certificate name `un-configured` counts as no name.

    ## Hosts and origins
    The *configured names* of a domain are its `dns` setting if present,
    otherwise the server certificate's name, plus the host names of any
    origins in the domain's `allowedOrigin` list. The placeholder certificate
    name `un-configured` is never a configured name. The *expected origin* is
    `https://<configured name>` plus `:<port>` when the externally visible
    port (`aliasPort` if set, otherwise `port`) is not 443.
    * A request whose `Host` header is not a configured name (with the
      expected port) gets `421 invalid_host`.
    * The server never derives configured names or origins from the `Host`
      header.
    * An Origin check compares the full origin (scheme, host and port)
      exactly with an expected origin, or with an origin in `allowedOrigin`.
      `allowedOrigin: true` is treated as an empty list. `http:` origins
      never match.

    ## Credentials
    A request uses exactly one credential. If a request carries both a bearer
    token and a cookie, only the bearer token is used.

    ### Browser session (`cookieSession`)
    `POST /api/v1/auth/login` (plus `POST /api/v1/auth/2fa` when needed)
    creates a standard MeshCentral session, so the same cookie works in the
    legacy UI. The session cookie is `xid` (plus `xid.sig`). Its attributes
    are server-wide MeshCentral settings: `HttpOnly`; `SameSite` from
    `sessionsamesite` (default `Lax`); `Secure` unless TLS is offloaded, where
    `sessionsecure` decides. The CSRF rules below do not depend on these
    attributes.

    Each session has a server-side **session record**, keyed by the
    session's user id and random session id. It is persisted in the
    database, and is written when the session is created:
    * `ia`: issue time, written once and never changed;
    * `last_auth`: the time of the last real password check, and
      `last_auth_2fa`: the time of the last real second-factor check. Both
      are updated only by an actual check at login or re-authentication.
      The login handler that performed the check writes them; creating a
      session does not. A session created without such a check has neither,
      and never passes step-up.

    A session cookie that has no session id (for example one issued before
    session records existed) is cleared and treated as no credential. It is
    never upgraded: the server does not create a session record for it.

    Rules, for every endpoint on the server (the API and its streams and
    consoles, MeshCentral's websocket and relay endpoints, auth cookies
    derived from a session, and `/legacy`):
    * a session without a session record is expired;
    * a session whose `ia` is older than `outbandApi.sessionLifetimeHours`
      (default 12) is expired;
    * a logged-out session is expired. Every logout, through the API or the
      legacy UI, writes the session to a persisted revocation list, which the
      server loads at startup;
    * auth cookies derived from a session carry the session's `ia` and
      session id, and stop working when the session expires.

    On `/api/v1`, the user is also loaded from the database on every request.
    A deleted user, a user with the site right `LOCKED` (0x20), or a session
    older than the user's `sessions_not_before` time gets `401
    unauthenticated`, and the session is cleared. A password change or reset
    sets `sessions_not_before` to the current time.

    Sessions created from a MeshCentral **login token** (user names that
    start with `~t:`, or sessions marked as login-token sessions) cannot use
    `/api/v1`: login with such a name answers `401 invalid_credentials`, and
    any request made with such a session gets `401 unauthenticated`.

    ### API token (`bearerToken`)
    `Authorization: Bearer obt_<secret>`. Tokens are for machine clients.
    * A user creates a token from a browser session
      (`POST /api/v1/auth/tokens`). The secret is shown once. The server
      stores only `sha256(secret)`, and finds tokens by that hash.
    * A token belongs to the domain it was created in, and works only there.
    * A token has scopes, an expiry, and can be limited to device groups
      (`groups`) and to client addresses (`allowed_ips`).
    * Bearer requests must arrive over TLS (directly, or through a TLS
      offloader listed in `trustedProxy`). Otherwise the server answers
      `403 https_required`.
    * On every request the server loads the owning user and re-evaluates
      that user's current MeshCentral rights. Nothing is cached from when the
      token was created. A deleted or locked user gets
      `401 token_revoked`.
    * A password change or reset revokes all of the user's tokens.
    * A full site administrator cannot be locked. To cut off an
      administrator's tokens, another administrator revokes them
      (`DELETE /api/v1/admin/tokens/{tokenId}`), or uses the kill switch.

    **Kill switch.** `PUT /api/v1/admin/settings` with `{"bearer": false}`
    turns off all bearer authentication at runtime, with no restart. The
    value is stored in the database. Every server re-reads it at least every
    5 seconds, and the server that receives the change applies it at once.
    While it is off, every bearer request gets `401 unauthenticated`, and
    open bearer streams and consoles close within 5 seconds. The config.json
    setting `outbandApi.bearer` is only the startup default, used until an
    administrator stores a value.

    ## CSRF
    Every cookie-authenticated request that is not `GET`/`HEAD` needs both of
    these. That includes the unauthenticated `login`, `2fa` and `logout`
    calls.
    * The header `X-Outband: 1`.
    * An `Origin` header, present, that matches (see Hosts and origins).
    The WebSocket upgrade for a console ticket issued to a cookie session
    needs the matching `Origin` as well. A failure gets `403 csrf_failed`.
    Bearer requests do not need these checks.
    * `/api/v1` never sends CORS headers, and every `OPTIONS` request gets
      `403 csrf_failed`.
    * Request bodies must be `application/json` (`415` otherwise).
    * No `GET` changes state.

    ## Two-factor login
    When the password is correct and MeshCentral's own policy says a second
    factor is required, the server starts a **pending login**:
    * The cookie holds only an opaque random pending-login id and its expiry.
      All other state is kept on the server, keyed by that id, with an expiry
      of at most 5 minutes: the user id, the failed-code count, and the
      code-send counters. No username or password is stored anywhere.
    * A pending login authenticates nothing, on any endpoint.
    * After 5 wrong codes, or at expiry, the pending login is discarded.
    * Per user id, across pending logins: at most 10 wrong codes in 15
      minutes. After that, second-factor checks for that user are refused for
      15 minutes.
    * Sending a code by email or SMS: at most 1 per 60 seconds and 5 per
      pending login, and 10 per user per hour. These counters are kept on
      the server.
    * The API ignores MeshCentral's "remember this device" second-factor
      cookie, so a second factor is always asked for when the policy
      requires one.
    * Users whose only second factor is a WebAuthn/FIDO key cannot log in
      through v1 (`401 invalid_credentials`, no session). They use `/legacy`.

    `/api/v1/server` reports `features.twofa.available: false` when the server
    configuration does not offer two-factor login, and the server logs a
    warning at startup. It reports `features.twofa.ip_exemptions: true` when
    the domain exempts some client addresses from the second factor.

    **Step-up.** Some operations need a recent real authentication on the
    session: `last_auth` within the last 15 minutes. When the user has a
    second factor enrolled, `last_auth_2fa` must also be within 15 minutes.
    An address exemption does not count as a second factor. If the check
    fails, the server answers `401 reauth_required`. These operations need
    step-up:
    * creating a token with any scope other than `read` or `identity`
      (so `audit`, `power_on`, `power_off` and `console` all need it);
    * `PUT /api/v1/admin/settings`.

    ## Scopes
    A browser session holds every scope. A token holds only the scopes it was
    created with, and every scope implies `read`.

    | Scope | Allows |
    |---|---|
    | `read` | Read groups, devices, events, the stream. |
    | `power_on` | Power actions `on` and `wake`. |
    | `power_off` | Power actions `off`, `reset`, `cycle` and `sleep`. |
    | `console` | Text consoles only: `sol` now, `terminal` later. Future screen, disk and administrative access will get scopes of their own, never `console`. |
    | `identity` | Shows the owner's email and site rights in `/api/v1/session`. |
    | `audit` | Shows real user names and token names in events (see Privacy). |

    The **`device_power`** profile, given as `"profile": "device_power"` at
    creation, means exactly `read` + `power_on` + `power_off`. It has no
    `identity` or `audit`, and no `console`. It suits automation that only
    needs device state and power.

    Token lifetime limits:
    * `read` and `identity` only: up to 365 days;
    * with `audit`, `power_on` or `power_off`: up to 90 days;
    * with `console`: up to 30 days, and the token must have a `groups` list.

    ## Authorization
    Every request is checked in this fixed order:
    1. credential;
    2. visibility (`404 not_found`, the same as for a device that does not
       exist);
    3. scope (`403 insufficient_scope`);
    4. MeshCentral rights (`403 forbidden`);
    5. reachability (`409 not_reachable`).

    A token's `groups` restriction narrows visibility. The rights are the
    owning user's effective MeshCentral rights on the device's group (from
    the user's links and user-group memberships), re-evaluated on each
    request. Full rights (`0xFFFFFFFF`) are not subject to the "must not
    have" column.

    | Operation | Path | Scope | Required right | Must not have |
    |---|---|---|---|---|
    | Read group or device | | read | any (visible) | |
    | Device events | | read | visible | `LIMITEVENTS` (0x2000) restricts to the caller's own events |
    | `on` | AMT power-up | power_on | `WAKEDEVICE` (0x40) | `NOAMT` (0x800) |
    | `on` / `wake` | IP-KVM / PDU port on | power_on | `WAKEDEVICE` (0x40) | |
    | `wake` | Wake-on-LAN from peer agents | power_on | `WAKEDEVICE` (0x40) | |
    | `wake` | plus AMT power-up | power_on | `WAKEDEVICE` (0x40) | `NOAMT` (0x800): without it, only Wake-on-LAN is sent |
    | `wake` | MQTT | power_on | `WAKEDEVICE` (0x40) | |
    | `off`, `reset`, `sleep` | agent | power_off | `RESETOFF` (0x40000) | |
    | `off`, `reset`, `sleep` | MQTT | power_off | `RESETOFF` (0x40000) | |
    | `off`, `reset`, `cycle` | AMT | power_off | `RESETOFF` (0x40000) | `NOAMT` (0x800) |
    | `off` | IP-KVM / PDU port off | power_off | `RESETOFF` (0x40000) | |
    | console `sol` | AMT redirection | console | `REMOTECONTROL` (0x8) | `NOAMT` (0x800), `REMOTEVIEWONLY` (0x100) |
    | console `terminal` (later) | agent terminal | console | `REMOTECONTROL` (0x8) | `NOTERMINAL` (0x200), `REMOTEVIEWONLY` (0x100) |
    | Domain-wide event view | | read, and no `groups` restriction | site right `ALLEVENTS` (0x800) or full site admin | |
    | `/admin/*` | | browser session | full site admin | |

    Notes:
    * Wake-on-LAN needs a known MAC address for the device and an online
      agent in the same group. In groups of kind `amt` and `local`, `wake`
      works only through AMT.
    * `on` and `cycle` have no agent path.
    * A **group-restricted token** never gets the domain-wide event view,
      even when its owner has `ALLEVENTS` or full site rights. It sees only
      events about its groups and their devices (still subject to the
      owner's rights and `LIMITEVENTS`), plus the owner's own user events.
      This applies to `/events`, `/devices/{id}/events`, `/stream`, and
      events delivered again after a stream reconnect.
    * A bearer token on a browser-session-only endpoint gets `403 forbidden`
      with `details.reason: session_required`.

    ## Privacy
    * **Event messages.** `Event.message` is built only from an allowlist of
      templates, chosen by the event's kind, with typed parameters. Events
      with no template get a generic message for their type, such as
      "Device event". Free text from MeshCentral events is never passed
      through. `user` parameters follow the identity rule below. `ip` and
      `email` parameters are shown only to callers allowed to see
      `source_ip`; others see "(hidden)".
    * **Identity in events.** Tokens without the `audit` scope see every
      user as a stable opaque pseudonym (`Event.user.id` like `u_3f9a1c2b`,
      `name: null`, `redacted: true`) and every token as one
      (`token_id` like `t_77d0e4aa`, `token_name: null`). Pseudonyms are
      HMACs that stay stable per token, so one client can correlate events
      but not identify people. Browser sessions and tokens with `audit` see
      real ids and names.
    * **Pseudonym key.** The HMAC key is a server secret, generated by the
      server and stored with its other secrets. It is never exposed through
      the API or written to logs. Rotating the key changes every pseudonym,
      so pseudonyms issued before a rotation can no longer be correlated
      with those issued after it.
    * **source_ip** is stored in full in Outband audit events. It is shown
      only to full site administrators: through a browser session, or
      through a token with the `audit` scope, owned by a full site
      administrator and with no `groups` restriction. The rule applies the
      same way to `/events`, `/devices/{id}/events` and `/stream`.
      Group-restricted tokens never see it.
    * **Session info for tokens.** With a token, `/api/v1/session` omits
      `user.email` and `user.siteadmin` unless the token has the `identity`
      scope.
    * **Device details for tokens.** `ips` and `hardware.serial` are left
      out of device responses (REST and stream) for every token without the
      `console` scope. That includes `device_power` tokens and tokens with
      only `read`, `identity`, `audit`, `power_on` or `power_off`.
    * **Not stored.** Outband stores no user agents and no request bodies.
    * **Retention.**
      * Outband audit events: 365 days by default
        (`outbandApi.auditRetentionDays`), kept apart from MeshCentral's own
        event expiry.
      * Session records and revocation-list entries: until the session's
        absolute expiry plus 1 hour.
      * API token rows: while live, then 30 days after expiry or revocation.
      * Idempotency keys: 24 hours.
      * Pending logins: in memory, at most 5 minutes.
    * **Erasure.** When a user is deleted, their tokens, session records
      and pending logins are deleted at once. Their audit events are kept
      until retention ends. In those events the user's name is replaced by
      "deleted user", the user id by a pseudonym, and `source_ip` is
      truncated (IPv4 to its /24 network, IPv6 to its /48 network).

    ## Auditing
    Outband writes its own persisted audit events for:
    * login, logout, 2FA success and failure;
    * token create and revoke, by the owner or an admin;
    * each change of the kill switch, in both directions;
    * power actions (dispatched or denied with `403`);
    * console tickets (issued or denied) and console WebSocket opens;
    * use of a revoked or expired token;
    * `csrf_failed`;
    * `404` on device endpoints.
    Denials are aggregated: at most one record per credential, reason and
    minute, with a count. Each event records the user, the token, the source
    IP and the outcome.

    ## Rate limits
    * **Login and 2FA.** MeshCentral's per-IP invalid-login ban applies.
      Outband also keeps its own per-account counter: after 10 failed
      password logins in 15 minutes, API logins for that account are refused
      for 15 minutes. Unknown user names cost the same time as known ones (a
      dummy password hash is checked). An unknown user, a wrong password, a
      locked account, a counter lock and a WebAuthn-only account all get the
      same `401 invalid_credentials`. A per-IP ban gets `429 rate_limited`.
      **Accepted trade-off:** anyone who knows a user name can keep that
      account's API logins locked by sending wrong passwords. Outband
      accepts this in exchange for limiting password guessing across many
      addresses. Existing sessions and tokens are not affected, and the
      failures are audited.
      These endpoints send no `RateLimit-*` headers.
    * **Invalid bearer tokens** are limited per client IP by a separate
      limiter: 30 in 10 minutes, then bearer requests from that IP get `429`
      for 10 minutes. This does not feed the login ban.
    * **Per credential** (token, or session user): 600 requests per minute,
      30 power and console-ticket requests per minute, and 5 concurrent SSE
      streams.
    * **Per device:** 6 power actions per minute, across all callers.
    * Operators can change these with `outbandApi.rateLimits`. Responses
      outside the auth endpoints carry `RateLimit-Limit`,
      `RateLimit-Remaining` and `RateLimit-Reset`. A `429` carries
      `Retry-After`.

    ## Logging
    The server never logs secrets. Request and debug logs always redact:
    * the `Authorization`, `Cookie`, `Set-Cookie` and
      `Sec-WebSocket-Protocol` headers;
    * the query parameters `ticket`, `token` and `access_token`, including
      on requests that are rejected;
    * the request bodies of `login` and `2fa`;
    * the response bodies of `createToken` and `createConsoleTicket`.

    ## Live updates
    `GET /api/v1/stream` is a Server-Sent Events stream (see `streamEvents`).
    Text consoles are WebSockets opened with a single-use ticket (see
    `createConsoleTicket`). SSE streams and console WebSockets are checked
    again at least every 5 seconds, and immediately when the server learns
    of a relevant change. They close within 5 seconds of: revocation,
    expiry, logout, session expiry, user deletion or lock, loss of the
    needed rights, or the kill switch (consoles close with `4403`, streams
    end with a `closed` event).

    ## Assumptions
    1. **Client address.** MeshCentral either terminates TLS itself, or sits
       behind a TLS offloader listed in `trustedProxy`. Every per-IP limit
       and `allowed_ips` uses MeshCentral's resolved client address. An IP
       ban answers API callers with `429` JSON, never an HTML page.
    2. **2FA policy.** `/auth/login` uses MeshCentral's own decision on
       whether a second factor is required. The API calls it without the
       "remember this device" cookie and never with login-token options.
    3. **Audit retention.** Outband audit events are kept in their own
       collection, with their own retention, not subject to MeshCentral's
       event expiry.
    4. **SOL.** v1 does not record SOL sessions. A device has at most one
       SOL session at a time; a second ticket request gets `409 busy`.
    5. **Kill switch on peers.** In a multi-server setup, every server
       re-reads the settings record at least every 5 seconds.
    6. **Already in the requested state.** A power action is dispatched
       even if the device seems to be in the target state already (`202`).
       The power state the API knows can be stale.
    7. **Wrong credential type.** A bearer token on a session-only endpoint
       gets `403 forbidden`, with `details.reason: session_required`.
    8. **Health.** `degraded` answers `200`. `starting`, or a database that
       cannot be reached, answers `503`.

    ## Implementation notes (non-normative)
    * **Session records (a required change to `webserver.js`, kept
      minimal).** Create the session record in the one function that gives
      every new login its random session id, so every login path is covered.
      At startup, load the persisted revocation list into MeshCentral's
      destroyed-sessions table. Keep its entries until each session's
      absolute expiry. The existing session middleware and auth-cookie check
      call one Outband function that applies the session rules. Every
      changed line is marked as an Outband change, and the logic lives in
      the new module.
    * **Audit:** write Outband audit records directly. Do not rely on
      MeshCentral's event dispatch for them.
    * **Mapping:** build every response object field by field from an
      allowlist. Never copy or spread MeshCentral objects.
    * **Tokens:** look them up by an index on the hash. Compare in constant
      time.
    * **WebSocket upgrade:** mark the ticket used atomically, then re-check
      the credential, rights and Origin, before the relay opens.
    * **Pending 2FA and counters:** an in-memory map with expiry and a size
      cap.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: /
    description: The Outband server that serves this document

tags:
  - name: server
    description: Health and server information.
  - name: auth
    description: Browser sessions, two-factor login and API tokens.
  - name: admin
    description: Site-administrator operations.
  - name: groups
    description: Device groups (MeshCentral "meshes").
  - name: devices
    description: Managed devices (MeshCentral nodes).
  - name: power
    description: Power control through the agent, Intel AMT, Wake-on-LAN, MQTT or IP-KVM.
  - name: console
    description: Text console WebSockets.
  - name: events
    description: Event and audit log.
  - name: stream
    description: Server-Sent Events for live updates.

security:
  - cookieSession: []
  - bearerToken: []

paths:
  /api/v1/health:
    get:
      tags: [server]
      operationId: getHealth
      summary: Liveness and readiness
      description: Needs no authentication, and shows nothing about the configuration.
      security: []
      responses:
        '200':
          description: Up (`ok` or `degraded`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok }
        '503':
          description: Starting, or the database cannot be reached.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: starting }
        '429': { $ref: '#/components/responses/RateLimited' }
        default: { $ref: '#/components/responses/DefaultError' }

  /api/v1/server:
    get:
      tags: [server]
      operationId: getServer
      summary: Server name, version and features
      responses:
        '200':
          description: OK
          headers:
            RateLimit-Limit: { $ref: '#/components/headers/RateLimit-Limit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimit-Remaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimit-Reset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerInfo' }
              example:
                name: Outband
                version: 1.3.1
                outband_version: 0.1.0
                api_version: 1.0.0-draft.5
                features:
                  amt: true
                  twofa: { available: true, ip_exemptions: false, methods: [otp, email] }
                  api_tokens: true
                  console_kinds: [sol]
                  legacy_ui: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/DefaultError' }

  /api/v1/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current authentication state
      description: |
        Needs no authentication. With no valid credential, or during a
        pending login, it returns `authenticated: false` (with
        `twofa.required: true` during a pending login). `server.version` is
        only present when authenticated. With a token, `user.email` and
        `user.siteadmin` are left out unless the token has the `identity`
        scope.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
              examples:
                anonymous:
                  value:
                    authenticated: false
                    user: null
                    auth_method: null
                    scopes: []
                    server: { name: Outband }
                    twofa: { required: false }
                browser:
                  value:
                    authenticated: true
                    user: { id: alice, name: alice, email: alice@example.com, siteadmin: 0 }
                    auth_method: cookie
                    scopes: [read, power_on, power_off, console, identity, audit]
                    server: { name: Outband, version: 1.3.1 }
                    twofa: { required: false }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/DefaultError' }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with username and password
      description: |
        Checks the credentials with MeshCentral's own authentication
        (including configured LDAP or other backends). On success it creates
        a new MeshCentral session with a new session id, and the session
        record. If a second factor is required, it starts a pending login
        instead (see Two-factor login). The response for every refusal is the
        same `401 invalid_credentials`. Needs `X-Outband: 1` and a matching
        `Origin`. No `RateLimit-*` headers.
      security: []
      parameters:
        - $ref: '#/components/parameters/XOutband'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { username: alice, password: correct-horse-battery-staple }
      responses:
        '200':
          description: Logged in, or a second factor is required.
          headers:
            Set-Cookie:
              description: MeshCentral session cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
              examples:
                success:
                  value:
                    authenticated: true
                    user: { id: alice, name: alice, email: alice@example.com, siteadmin: 0 }
                second_factor:
                  value:
                    authenticated: false
                    twofa: { required: true, methods: [otp, email], expires_at: '2026-01-01T12:05:00Z' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Refused (`invalid_credentials`). The body is the same for every reason.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: { code: invalid_credentials, message: Invalid username or password } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '421': { $ref: '#/components/responses/InvalidHost' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/DefaultError' }

  /api/v1/auth/2fa:
    post:
      tags: [auth]
      operationId: loginSecondFactor
      summary: Complete a pending login with a second factor
      description: |
        Checks `code` with MeshCentral's own second-factor logic (TOTP,
        backup codes, email, SMS or messaging codes, YubiKey OTP). `method`
        is optional. To have a code sent, send
        `{"method": "email", "send": true}` without a code; the server
        answers `202`. On success the pending login becomes a full session
        with a new session id, and `last_auth_2fa` is set. See Two-factor
        login for the limits. No `RateLimit-*` headers.
      security: []
      parameters:
        - $ref: '#/components/parameters/XOutband'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecondFactorRequest' }
            example: { code: '123456', method: otp }
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginSuccess' }
        '202':
          description: A code was sent through the requested method.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Wrong code (`invalid_code`), or no pending login, or it expired or reached its limit (`no_pending_login`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '421': { $ref: '#/components/responses/InvalidHost' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/DefaultError' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the browser session
      description: |
        Clears the session cookie and puts the session on the persisted
        revocation list, so it stops working on every endpoint, also after a
        restart. Streams and consoles opened by this session close within 5
        seconds. Succeeds even when the caller was not logged in.
      security: []
      parameters:
        - $ref: '#/components/parameters/XOutband'
      responses:
        '204': { description: Logged out. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '421': { $ref: '#/components/responses/InvalidHost' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/DefaultError' }

  /api/v1/auth/tokens:
    get:
      tags: [auth]
      operationId: listTokens
      summary: List the caller's API tokens
      description: Browser session only. Includes expired and revoked tokens for 30 days. Secrets are never returned.
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          headers:
            RateLimit-Limit: { $ref: '#/components/headers/RateLimit-Limit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimit-Remaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimit-Reset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/DefaultError' }
    post:
      tags: [auth]
      operationId: createToken
      summary: Create an API token for the caller
      description: |
        Browser session only. Give either `scopes` or `profile`, not both.
        The token acts as the caller, limited by its scopes, `groups` and
        `allowed_ips`. See Scopes for lifetime limits and Credentials for
        step-up (`401 reauth_required`). A user can hold at most 50 live
        tokens. The response is the only time the secret is shown, and the
        server never logs it.
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/XOutband'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTokenRequest' }
            examples:
              automation:
                value: { name: home-automation, profile: device_power, expires_in_days: 90, allowed_ips: ['192.0.2.0/28'] }
              console:
                value: { name: sol-console, scopes: [console], groups: ['EXAMPLEgroupId0000000000000000000000000000000000000000000000000'], expires_in_days: 30 }
      responses:
        '201':
          description: Created. Store the secret now; it cannot be shown again.
          headers:
            RateLimit-Limit: { $ref: '#/components/headers/RateLimit-Limit' }
            RateLimit-Remaining: { $ref: '#/components/headers/RateLimit-Remaining' }
            RateLimit-Reset: { $ref: '#/components/headers/RateLimit-Reset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedToken' }
              example:
                token:
                  id: tok_EXAMPLE01
                  name: home-automation
                  owner: { id: alice, name: alice }
                  prefix: obt_EXAM
                  scopes: [read, power_on, power_off]
                  groups: null
                  allowed_ips: ['192.0.2.0/28']
                  created_at: '2026-01-01T12:00:00Z'
                  expires_at: '2026-04-01T12:00:00Z'
                  last_used_at: null
                  revoked_at: null
                secret: obt_EXAMPLEexampleEXAMPLEexampleEXAMPLEexampleE
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Token limit reached (`token_limit`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        default: { $ref: '#/components/responses/DefaultError' }

  /api/v1/auth/tokens/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/TokenId'
    delete:
      tags: [auth]
      operationId: revokeToken
      summary: Revoke one of the caller's tokens
      description: Browser session only. Takes effect at once; streams and consoles using the token close within 5 seconds. The record stays, with `revoked_at` set.
